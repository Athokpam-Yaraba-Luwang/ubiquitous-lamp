name: Use Secrets securely

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use API Key
        run: echo "Using secret safely"
        env:
          API_KEY: ${{ secrets.API_KEY }}
